<script>
const SB=supabase.createClient('https://uehuvtnrsktskfmmbnul.supabase.co','sb_publishable_e-D582vTrmEAqG7X18sSlg_51trSTZG');
const DEMO={batch:'WV260930-04',product:'Whey Vanilla',spec:'WV-V3',pallet:'1/2',
items:[{name:'Maltodextrin',kg:25,qty:40},{name:'Skimmed Milk Powder',kg:25,qty:30},{name:'Whey Protein Concentrate',kg:20,qty:15},{name:'Vanilla Flavour',kg:5,qty:4}]};
let me=null,adminPin='',view='login',stage=null,checkNo=1,qr=null,selected=null;
let state=JSON.parse(localStorage.getItem('bc_runtime')||'null')||{scans:{build:{1:{},2:{}},filling:{1:{},2:{}}},ops:{build:{},filling:{}},holds:[],audit:[],quality:{status:'waiting',by:null,id:null,time:null,reason:null}};
const A=document.getElementById('app');
function save(){localStorage.setItem('bc_runtime',JSON.stringify(state))}
function log(x){state.audit.unshift(new Date().toLocaleString()+' — '+x);save()}
function H(){return `<header><b>APPLIED NUTRITION</b><span>Blender Control</span><span class="grow"></span><span>${me?.name||''}</span><button class="secondary" onclick="home()">Home</button><button class="secondary" onclick="logout()">Logout</button></header>`}
function R(){
 if(view==='login'){A.innerHTML=`<main class="login"><div class="card"><span class="ey">BLENDER CONTROL</span><h1>Sign in</h1><p class="muted">Enter your 6-digit PIN</p><input id="pin" class="pin" inputmode="numeric" maxlength="6" type="password"><button class="primary" style="width:100%" onclick="login()">Login</button><p id="err" class="muted"></p></div></main>`;return}
 if(view==='home'){A.innerHTML=H()+`<main class="wrap"><span class="ey">${me.role.toUpperCase()}</span><h1>Select operation</h1><div class="grid">${me.role!=='quality'?`<button class="tile" onclick="showBuildProducts()"><b>Build Blender</b>Choose a recipe (Spec), prepare, label and verify ingredients</button>`:''}${['operator','supervisor','admin'].includes(me.role)?`<button class="tile green" onclick="fillingHub()"><b>Filling Check</b>Checklist · Knife Control · Pallet Verification</button>`:''}${(me.role==='quality'||me.role==='admin')?`<button class="tile" style="background:#7656a8" onclick="qualityBlenderScanner()"><b>Blender Release</b>Scan Blender QR, view its production queue and release or hold</button>`:''}</div>${me.role==='admin'?`<div class="card"><h2>Administration</h2><div class="actions"><button class="primary" onclick="view='users';R()">Users</button><button class="secondary" onclick="showAudit()">Audit trail</button><button class="danger" onclick="resetDemo()">Reset demo batch</button></div></div>`:''}</main>`;return}
 if(view==='buildLines'){
 const lines=['Line 1','Line 2','Line 3','Line 4','Line 5','Line 6','Capsule Line','Gel Line','Tablet Line'];
 A.innerHTML=H()+`<main><button class="secondary" onclick="view='home';R()">← Back</button><span class="ey">BLENDER TEAM</span><h1>Select line</h1><p class="muted">Choose the production line to see its recipes / Specs.</p><div class="card"><h2>Production lines</h2>${lines.map((l,i)=>`<button class="tile" style="width:100%;text-align:left;margin:10px 0;background:${i<6?'#1475c9':'#0b7f67'}" onclick="openRecipeLine('${l}')"><b>${l}</b><span style="display:block;font-size:.82em;margin-top:7px">${PRODUCT_CATALOG.filter(x=>x.line===l).length} recipe(s)</span></button>`).join('')}</div></main>`;return}
 if(view==='buildProducts'){
 const recipes=PRODUCT_CATALOG.filter(x=>x.line===selectedLine);
 A.innerHTML=H()+`<main><button class="secondary" onclick="view='buildLines';R()">← Back to lines</button><span class="ey">BLENDER TEAM · ${selectedLine}</span><h1>Select recipe</h1><p class="muted">Choose a recipe (Spec) for ${selectedLine}.</p><div class="card"><h2>${selectedLine} — Recipes / Specs</h2>${recipes.map(x=>{const i=PRODUCT_CATALOG.indexOf(x);return `<button class="tile" style="width:100%;text-align:left;margin:10px 0;background:#1475c9" onclick="selectBuildProduct(${i})"><b>${x.product}</b><span style="display:block;font-size:.82em;margin-top:7px">Spec ${x.spec} · ${x.status}</span></button>`}).join('')}</div><button class="secondary" onclick="view='buildLines';R()">← Back to lines</button></main>`;return}
 if(view==='users'){A.innerHTML=H()+`<main class="wrap"><span class="ey">ADMINISTRATION</span><h1>Users</h1><div class="card"><h2>Registered users</h2><div id="userlist"><p class="muted">Loading users...</p></div></div><div class="card"><h2>Add employee</h2><p class="muted">User ID is generated automatically (AN0001, AN0002...)</p><input id="nm" placeholder="Full name"><input id="np" maxlength="6" inputmode="numeric" type="password" placeholder="6-digit PIN"><select id="role"><option value="operator">Operator</option><option value="supervisor">Supervisor</option><option value="quality">Quality</option><option value="admin">Admin</option></select><button class="primary" onclick="addUser()">Create user</button><p id="msg" class="muted"></p></div></main>`;loadUsers();return}
 if(view==='work'){
   const d=state.scans[stage][checkNo];
   A.innerHTML=H()+`<main class="wrap"><span class="ey">${stage.toUpperCase()} · CHECK ${checkNo}</span><h1>${DEMO.product}</h1><p class="muted">Batch ${DEMO.batch} · ${DEMO.spec} · Pallet ${DEMO.pallet}</p><span class="status">INDEPENDENT CHECK</span>
   <div class="card">${DEMO.items.map((x,i)=>{let n=(d[i]||[]).length,p=Math.min(100,100*n/x.qty);return `<div class="row"><div><b>${x.name}</b><div class="muted">${x.kg} kg · ${x.qty} required</div><div class="bar"><i style="width:${p}%"></i></div><div class="actions"><button class="primary" onclick="scanBag(${i})">Scan QR</button>${stage==='build'?`<button class="secondary" onclick="previewLabels(${i})">Generate ${x.qty} QR Codes</button><button class="secondary" onclick="showTestQR(${i})">Test QR</button><button class="secondary" onclick="labels(${i})">Print labels</button>`:''}</div></div><b>${n}/${x.qty}</b></div>`}).join('')}</div>

}
async function login(){
 const p=document.getElementById('pin').value.replace(/\D/g,''); if(p.length!==6)return err('Enter 6 digits.');
 const {data,error}=await SB.rpc('login_pin',{p_pin:p});
 if(error||!data?.length)return err('Invalid or inactive PIN.');
 me=data[0]; if(me.role==='admin')adminPin=p; log(me.name+' signed in'); view='home';R()
}
function err(x){document.getElementById('err').textContent=x}
function logout(){if(me)log(me.name+' signed out');me=null;adminPin='';view='login';R()}
function home(){view='home';stage=null;selected=null;R()}
function openStage(x){stage=x;checkNo=state.ops[x][1]?2:1;if(checkNo===2&&state.ops[x][1]===me.id){alert('Check 2 must be completed by a different operator.');return}view='work';log(me.name+' opened '+x+' Check '+checkNo);R()}
async function loadUsers(){
 const box=document.getElementById('userlist');if(!box)return;
 const {data,error}=await SB.rpc('admin_list_users',{p_admin:me.id,p_pin:adminPin});
 if(error){box.innerHTML='<p class="muted">User directory needs the final database update before it can be displayed.</p>';return}
 box.innerHTML=`<table><thead><tr><th>User ID</th><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody>${data.map(u=>`<tr><td><b>${u.employee_id}</b></td><td>${u.name}</td><td>${u.role}</td><td>${u.active?'Active':'Inactive'} ${u.active && u.employee_id!==me.employee_id?`<button class="danger" style="padding:7px 10px;margin-left:6px" onclick="removeUser('${u.employee_id}','${String(u.name).replace(/'/g,"\\'")}')">Remove</button>`:''}</td></tr>`).join('')}</tbody></table>`;
}
async function addUser(){
 const nm=document.getElementById('nm').value.trim(),np=document.getElementById('np').value,role=document.getElementById('role').value,msg=document.getElementById('msg');
 if(!nm||!/^\d{6}$/.test(np)){msg.textContent='Enter the employee name and a 6-digit PIN.';return}
 const {data,error}=await SB.rpc('admin_create_user',{p_admin:me.id,p_pin:adminPin,p_name:nm,p_new_pin:np,p_role:role});
 if(error){msg.textContent='User IDs are generated automatically (AN0001, AN0002...).';return}
 msg.textContent='User '+data+' created successfully.';document.getElementById('nm').value='';document.getElementById('np').value='';loadUsers()
}
function startMaster(){
 stage='filling';
 // In production the Master Pallet QR payload will supply this automatically.
 state.currentFillingBlender=null; save();
 camera('master',null)
}
function scanBag(i){selected=i;camera('bag',i)}
function camera(kind,i){
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="cam"><div class="dialog"><span class="ey">QR SCANNER</span><h2>${kind==='master'?'Scan Pallet Master QR':'Scan Bag QR'}</h2><p class="muted">Point the rear camera at the label.</p><div id="reader"></div><div class="actions"><button class="secondary" onclick="stopCam()">Cancel</button></div></div></div>`);
 qr=new Html5Qrcode('reader');qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},t=>gotQR(kind,i,t),()=>{}).catch(()=>{alert('Camera could not start. Allow camera access for this website in Safari/browser settings.');stopCam()})
}
function stopCam(){const done=()=>document.getElementById('cam')?.remove();if(qr){try{qr.stop().then(done).catch(done)}catch(e){done()}}else done();qr=null}
function norm(x){return String(x).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function gotQR(kind,i,t){
 if(kind==='master'){if(t!==`AN|MASTER|${DEMO.batch}`)return;stopCam();openStage('filling');return}
 const x=DEMO.items[i],a=t.trim().split('|');if(a.length<7||a[0]!=='AN'||a[1]!=='BAG'||a[2]!==DEMO.batch||norm(a[3])!==norm(x.name))return;
 const seq=+a[4],total=+a[5],kg=+a[6];if(total!==x.qty||kg!==x.kg||seq<1||seq>x.qty){stopCam();hold('QR/specification mismatch: '+x.name);return}
 const arr=state.scans[stage][checkNo][i]||[];if(arr.includes(seq)){stopCam();alert('This bag has already been scanned in this check.');return}
 stopCam();
 if(seq===1&&!confirm(`CONFIRM MATERIAL\n\n${x.name}\n${x.kg} kg\n\nDoes the physical product and bag weight match?`)){hold('Material/weight rejected: '+x.name);return}
 state.scans[stage][checkNo][i]=[...arr,seq];log(`${stage} Check ${checkNo}: ${x.name} ${seq}/${x.qty} scanned by ${me.name}`);R()
}
function completeCheck(){
 const d=state.scans[stage][checkNo],missing=DEMO.items.filter((x,i)=>(d[i]||[]).length!==x.qty);
 if(missing.length){hold('Incomplete scan: '+missing.map(x=>x.name).join(', '));return}
 if(checkNo===1){state.ops[stage][1]=me.id;log(`${stage} Check 1 completed by ${me.name}`);save();alert('Check 1 complete. Check 2 must be completed by a DIFFERENT operator.');logout();return}
 if(state.ops[stage][1]===me.id){alert('Check 2 must be completed by a different operator.');return}
 state.ops[stage][2]=me.id;log(`${stage} Check 2 completed by ${me.name}`);save();
 if(stage==='build'){alert('Build complete. Master Pallet label is ready to print.');printMaster() }else {save();const bc=state.currentFillingBlender||'BLENDER-1';const br=state.qualityByBlender?.[bc];alert(br&&br.status==='released'?'Filling verification complete. BLENDER RELEASED — READY TO FILL.':'Filling verification complete. This blender is NOT RELEASED — DO NOT START FILLING.');}
 view='home';R()
}

 }

}

function blenderStatusForFillers(code){
 const b=BLENDERS[code]; if(!b) return '<span class="status warn">BLENDER NOT FOUND</span>';
 const q=state.qualityByBlender?.[code]||{status:'waiting'}; const qi=(state.blenderQueueIndex&&state.blenderQueueIndex[code])||0; const queue=b.queue.slice(qi);
 if(q.status==='released') return `<span class="status">BLENDER RELEASED ✓</span><p><b>${q.product||queue[0]||'Product not recorded'}</b></p><p class="muted">Released by ${q.id||''} ${q.by||''}${q.time?'<br>'+new Date(q.time).toLocaleString():''}</p>`;
 if(q.status==='hold') return `<span class="status warn">BLENDER HOLD</span><p><b>DO NOT USE BLENDER</b></p><p class="muted">${q.reason||'Contact Quality.'}</p>`;
 return `<span class="status warn">NOT RELEASED</span><p><b>Awaiting Quality release</b></p>`;
}
function selectFillingBlender(code){
 state.currentFillingBlender=code; save();
 document.getElementById('fhub')?.remove(); fillingHub();
}
function finishBlenderRun(code){
 if(!confirm(`Finish the current run on ${BLENDERS[code].name}?\n\nThe blender will be locked in the system until Quality releases it again.`)) return;
 if(!state.qualityByBlender) state.qualityByBlender={};
 if(!state.blenderQueueIndex) state.blenderQueueIndex={};
 state.blenderQueueIndex[code]=(state.blenderQueueIndex[code]||0)+1;
 state.qualityByBlender[code]={status:'waiting',reason:'Previous run completed — awaiting new Quality release',by:null,id:null,time:new Date().toISOString()};
 save(); log(`${code} RUN COMPLETE — LOCKED awaiting Quality release by ${me.name}`);
 document.getElementById('fhub')?.remove(); fillingHub();
}
function fillingHub(){
 if(!['operator','supervisor','admin'].includes(me.role)) return alert('Operator, Supervisor or Admin access required.');
 processDueAutoCloses(); ensureFillingPrep();
 document.getElementById('fhub')?.remove();
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="fhub"><div class="dialog">
 <span class="ey">FILLING TEAM</span><h2>Choose an operation</h2>
 <p class="muted">Choose what you need to do. The blender and product are identified automatically when the Master Pallet QR is scanned.</p>
 <div class="card"><h3>Filler Checklist</h3><p class="muted">Complete the pre-fill checks.</p><button class="primary" onclick="document.getElementById('fhub').remove();openFillerChecklist()">Open Checklist</button></div>
 <div class="card"><h3>Knife Control</h3><p class="muted">Knife Out when removed from the box. Knife In when returned.</p><div class="actions"><button class="secondary" onclick="document.getElementById('fhub').remove();knifeQR('out')">Knife Out · Remove</button><button class="primary" onclick="document.getElementById('fhub').remove();knifeQR('in')">Knife In · Return</button></div></div>
 <div class="card"><h3>Pallet Verification</h3><p class="muted">Scan the Master Pallet QR to identify the product, batch and assigned blender.</p><button class="primary" onclick="document.getElementById('fhub').remove();startMaster()">Scan Master Pallet QR</button></div>
 <button class="secondary" onclick="document.getElementById('fhub').remove()">Close</button>
 </div></div>`);
}
function openFillerChecklist(){document.getElementById('fprep')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="fcheck"><div class="dialog"><span class="ey">FILLER CHECKLIST</span><h2>Pre-fill checklist</h2>${['Work area clean and ready','Correct equipment available','Blender / filling area visually checked','Required PPE in place','No foreign material observed'].map(x=>`<label style="display:block;padding:10px 0"><input type="checkbox" class="precheck"> ${x}</label>`).join('')}<div class="actions"><button class="primary" onclick="saveFillerChecklist()">Complete Checklist</button><button class="secondary" onclick="document.getElementById('fcheck').remove();fillingHub()">Cancel</button></div></div></div>`)}
function saveFillerChecklist(){let b=[...document.querySelectorAll('.precheck')];if(b.some(x=>!x.checked))return alert('Complete every checklist item first.');ensureFillingPrep();state.fillingPrep.checklist=true;save();log(`FILLER CHECKLIST completed by ${me.name}`);document.getElementById('fcheck').remove();fillingHub()}
function knifeQR(d){ensureFillingPrep();document.getElementById('fprep')?.remove();let t=d==='in'?'KNIFE IN':'KNIFE OUT';document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="knife"><div class="dialog"><span class="ey">KNIFE CONTROL</span><h2>${t}</h2><p>Scan the QR code attached to the knife.</p><div class="actions"><button class="primary" onclick="recordKnife('${d}','AN|KNIFE|DEMO-001')">Test Knife QR</button><button class="secondary" onclick="document.getElementById('knife').remove();fillingHub()">Cancel</button></div></div></div>`)}

function fillingScanComplete(){
 // Demo app: Check 2 being assigned/completed is the current signal that the Filling verification reached 100%.
 return !!(state.ops && state.ops.filling && state.ops.filling[2]);
}
function scheduleAutoCloseAfterKnifeIn(){
 const code=state.currentFillingBlender||'BLENDER-1';
 if(!fillingScanComplete()) return;
 if(!state.autoClose) state.autoClose={};
 const due=Date.now()+10*60*1000;
 const released=state.qualityByBlender?.[code];
 state.autoClose[code]={due,product:(released?.product||BLENDERS[code].queue[((state.blenderQueueIndex||{})[code]||0)]||'Unknown product'),knifeInAt:new Date().toISOString(),filler:me.name,fillerId:me.employee_id};
 save();log(`${code} completion timer started after KNIFE IN — closes in 10 minutes`);
 setTimeout(()=>processAutoClose(code),10*60*1000);
}
function processAutoClose(code){
 const x=state.autoClose&&state.autoClose[code]; if(!x||Date.now()<x.due)return;
 if(!state.blenderHistory)state.blenderHistory={}; if(!state.blenderHistory[code])state.blenderHistory[code]=[];
 const release=state.qualityByBlender?.[code]||{};
 state.blenderHistory[code].unshift({product:x.product,status:'completed',releasedBy:release.by||null,releasedById:release.id||null,filledBy:x.filler,filledById:x.fillerId,knifeInAt:x.knifeInAt,completedAt:new Date().toISOString()});
 if(!state.blenderQueueIndex)state.blenderQueueIndex={};
 const blender=BLENDERS[code];
 const idx=blender.queue.indexOf(x.product);
 if(idx>=0){
   blender.queue.splice(idx,1);
   state.blenderQueueIndex[code]=Math.min(state.blenderQueueIndex[code]||0,blender.queue.length);
 } else state.blenderQueueIndex[code]=(state.blenderQueueIndex[code]||0)+1;
 if(!state.qualityByBlender)state.qualityByBlender={};
 state.qualityByBlender[code]={status:'waiting',reason:'Previous product completed — awaiting Quality release',by:null,id:null,time:new Date().toISOString()};
 delete state.autoClose[code];save();log(`${code} AUTO CLOSED — next product NOT RELEASED`);
}
function processDueAutoCloses(){if(!state.autoClose)return;Object.keys(state.autoClose).forEach(processAutoClose)}
function recordKnife(d,p){
 if(!p.includes('|KNIFE|'))return alert('Invalid Knife QR.');
 ensureFillingPrep();let n=new Date().toISOString();
 if(d==='out'){state.fillingPrep.knifeOut=true;state.fillingPrep.knifeOutAt=n;log(`KNIFE OUT — removed from box — ${p} by ${me.name}`)}
 else {state.fillingPrep.knifeIn=true;state.fillingPrep.knifeInAt=n;log(`KNIFE IN — returned to box — ${p} by ${me.name}`)}
 save();document.getElementById('knife')?.remove();
 if(d==='in'&&fillingScanComplete()){scheduleAutoCloseAfterKnifeIn();alert('Knife returned. Filling verification is complete. Blender will return to NOT RELEASED in 10 minutes.')}
 fillingHub();
}
function continueFilling(){document.getElementById('fprep')?.remove();startMaster()}
function qualityBanner(){
 const q=state.quality||{status:'waiting'};
 if(q.status==='released') return `<span class="status">BLENDER RELEASED ✓</span><h3>QUALITY AUTHORIZATION COMPLETE</h3><p class="muted">Released by ${q.id||''} — ${q.by||''}<br>${q.time?new Date(q.time).toLocaleString():''}</p>`;
 if(q.status==='hold') return `<span class="status warn">BLENDER HOLD</span><h3>DO NOT FILL BLENDER</h3><p>${q.reason||''}</p>`;
 return '<span class="status warn">AWAITING BLENDER RELEASE</span><p>Quality release is independent from Build and Filling checks.</p>';
}

const BLENDERS={
 'BLENDER-1':{name:'Blender 1',queue:['Whey Vanilla 1','Whey Vanilla 2','Mass Chocolate 1']},
 'BLENDER-2':{name:'Blender 2',queue:['Whey Chocolate 1','Diet Whey Chocolate 1']},
 'BLENDER-3':{name:'Blender 3',queue:['Clear Whey Orange & Mango 1','Mass Chocolate 2']}
};
let selectedBlender=null;
function qualityBlenderScanner(){
 if(!(me.role==='quality'||me.role==='admin'))return alert('Quality access required.');
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="bscan"><div class="dialog"><span class="ey">QUALITY · BLENDER RELEASE</span><h2>Scan Blender QR</h2><p class="muted">The QR identifies the blender. Its production queue is loaded separately.</p><div class="actions"><button class="primary" onclick="openBlenderRelease('BLENDER-1')">Test Blender 1 QR</button><button class="secondary" onclick="document.getElementById('bscan').remove()">Cancel</button></div></div></div>`);
}
function openBlenderRelease(code){
 processDueAutoCloses(); const blender=BLENDERS[code];if(!blender)return alert('Blender QR not recognized.');
 selectedBlender=code;document.getElementById('bscan')?.remove();
 const q=state.qualityByBlender?.[code]||{status:'waiting'};
 const qi=(state.blenderQueueIndex&&state.blenderQueueIndex[code])||0;
 const remaining=blender.queue.slice(qi);
 const releasedProduct=q.product||null;
 const productRows=remaining.length?remaining.map((product,i)=>{
   const isCurrent=q.status==='released'&&releasedProduct===product;
   return `<button class="${isCurrent?'primary':'secondary'}" style="width:100%;text-align:left;margin:5px 0" onclick="selectQualityProduct('${code}','${String(product).replace(/'/g,"\\'")}')"><b>${i+1}. ${product}</b>${isCurrent?' · CURRENT / RELEASED':''}</button>`;
 }).join(''):'<p>Queue complete</p>';
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="brelease"><div class="dialog">
 <span class="ey">QUALITY · ${blender.name.toUpperCase()}</span><h2>${blender.name}</h2>
 <div class="card"><h3>Current status</h3>
 ${q.status==='released'?`<span class="status">RELEASED ✓</span><p><b>${releasedProduct||'Product not recorded'}</b></p><p class="muted">${q.id||''} ${q.by||''}${q.time?'<br>'+new Date(q.time).toLocaleString():''}</p>`:
 q.status==='hold'?`<span class="status warn">HOLD · DO NOT USE</span><p><b>${q.product||'Blender on hold'}</b></p><p class="muted">${q.reason||''}</p>`:
 `<span class="status warn">NOT RELEASED</span><p><b>No product released</b></p><p class="muted">Select the product that will actually run.</p>`}
 </div>
 <div class="card"><h3>${q.status==='released'?'Production Queue':'Select product to release'}</h3>
 <p class="muted">${q.status==='released'?'Tap another product only if Quality needs to change the scheduled product.':'The queue is a schedule. Quality chooses the product actually going into this blender.'}</p>
 ${productRows}</div>
 ${state.blenderHistory?.[code]?.length?`<div class="card"><h3>History</h3>${state.blenderHistory[code].slice(0,5).map(h=>`<p><b>${h.product}</b> · COMPLETED<br><span class="muted">Released by ${h.releasedById||''} ${h.releasedBy||'—'}<br>Filled by ${h.filledById||''} ${h.filledBy||'—'}<br>Knife In ${new Date(h.knifeInAt).toLocaleString()} · Completed ${new Date(h.completedAt).toLocaleString()}</span></p>`).join('')}</div>`:''}
 <div class="actions"><button class="danger" onclick="setBlenderHold()">Place on Hold</button><button class="secondary" onclick="document.getElementById('brelease').remove()">Close</button></div>
 </div></div>`);
}
function selectQualityProduct(code,product){
 if(!(me.role==='quality'||me.role==='admin'))return alert('Quality access required.');
 const current=state.qualityByBlender?.[code];
 const msg=current?.status==='released'&&current.product!==product
   ?`${current.product} is currently RELEASED.\n\nChange the release to ${product}?`
   :`Release ${BLENDERS[code].name} for ${product}?`;
 if(!confirm(msg))return;
 if(!state.qualityByBlender)state.qualityByBlender={};
 state.qualityByBlender[code]={status:'released',product,reason:null,by:me.name,id:me.employee_id,time:new Date().toISOString()};
 save();log(`${code} RELEASED for ${product} by ${me.name}`);
 document.getElementById('brelease')?.remove();alert(`${BLENDERS[code].name} RELEASED — ${product}`);openBlenderRelease(code);
}
function setBlenderHold(){
 if(!(me.role==='quality'||me.role==='admin'))return alert('Quality access required.');
 const reason=prompt('Reason for Blender Hold');if(!reason)return;
 const current=state.qualityByBlender?.[selectedBlender]||{};
 if(!state.qualityByBlender)state.qualityByBlender={};
 state.qualityByBlender[selectedBlender]={...current,status:'hold',reason,by:me.name,id:me.employee_id,time:new Date().toISOString()};
 save();log(`${selectedBlender} HOLD by ${me.name} — ${reason}`);
 document.getElementById('brelease')?.remove();alert('BLENDER ON HOLD');openBlenderRelease(selectedBlender);
}
function qualityScanStart(){
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="qscan"><div class="dialog"><span class="ey">BLENDER RELEASE</span><h2>Scan Blender QR</h2><p class="muted">Scan the Blender QR to identify the blender independently from Build and Filling.</p><div class="actions"><button class="primary" onclick="document.getElementById('qscan').remove();qualityStart()">Test Blender QR</button><button class="secondary" onclick="document.getElementById('qscan').remove()">Cancel</button></div></div></div>`);
}
function qualityStart(){
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="qrel"><div class="dialog"><span class="ey">BLENDER RELEASE</span><h2>${DEMO.product}</h2><p><b>Batch:</b> ${DEMO.batch}<br><b>Pallet:</b> ${DEMO.pallet}</p><span class="status">INDEPENDENT BLENDER RELEASE</span><p class="muted">Quality can release or hold this blender before or after the Filling checks.</p><div class="actions"><button class="primary" onclick="qualityDecision('released')">Release for Filling</button><button class="danger" onclick="qualityDecision('hold')">Place on Hold</button><button class="secondary" onclick="document.getElementById('qrel').remove()">Cancel</button></div></div></div>`);
}
function qualityDecision(decision){
 if(!(me.role==='quality'||me.role==='admin')) return alert('Quality or Admin authorization required. Please sign in with an authorized account.');
 let reason=null;
 if(decision==='hold'){reason=prompt('Reason for Blender Hold');if(!reason)return}
 state.quality={status:decision,by:me.name,id:me.employee_id,time:new Date().toISOString(),reason};
 save();log(`QUALITY ${decision.toUpperCase()} by ${me.name}${reason?' — '+reason:''}`);
 document.getElementById('qrel')?.remove();
 alert(decision==='released'?'BLENDER RELEASED — READY TO FILL':'BLENDER HOLD — DO NOT FILL');
 R();
}
async function removeUser(employeeId,name){
 if(me.role!=='admin') return alert('Admin access required.');
 if(employeeId===me.employee_id) return alert('You cannot remove the account you are currently using.');
 if(!confirm(`Remove ${name} (${employeeId})?\n\nThe employee will lose access, but their production and audit history will be preserved.`)) return;
 const {error}=await sb.rpc('admin_deactivate_user',{p_admin:me.id,p_pin:adminPin,p_employee_id:employeeId});
 if(error){alert('Remove User is ready in the interface, but the database function still needs to be enabled.');return}
 alert(`${name} has been removed from active users.`);
 await loadUsers();R();
}
function resetDemo(){if(!confirm('Reset all demo scans/checks on this device?'))return;localStorage.removeItem('bc_runtime');location.reload()}
R();
</script></body></html>
