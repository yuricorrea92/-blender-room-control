<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062e5d"><title>Applied Nutrition — Blender Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102b48;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}header{background:#062e5d;color:#fff;padding:13px 4%;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:4}
.grow{flex:1}.wrap{max-width:1050px;margin:auto;padding:27px 15px}.card{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 6px 22px #173b5f12}
.login{min-height:100vh;background:linear-gradient(135deg,#062d59,#0875c9);display:grid;place-items:center;padding:20px}.login .card{width:min(430px,95vw);padding:32px}
.ey{font-size:11px;font-weight:900;letter-spacing:1.3px;color:#1473ca}.muted{color:#6b7e91}.small{font-size:12px}
input,select{width:100%;padding:13px;border:1px solid #cad7e4;border-radius:10px;margin:6px 0 12px}.pin{font-size:26px;text-align:center;letter-spacing:9px}
.primary,.secondary,.danger{border:0;border-radius:10px;padding:13px 16px;font-weight:800}.primary{background:#0875df;color:#fff}.secondary{background:#eaf5ff;color:#075fae}.danger{background:#b42318;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{padding:25px;text-align:left;border:0;border-radius:16px;color:#fff;background:#0b67c2}.tile.green{background:#087c63}.tile b{font-size:22px;display:block;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 80px;gap:9px;padding:15px;border-top:1px solid #edf1f5;align-items:center}.row:first-child{border-top:0}.bar{height:8px;background:#e8edf2;border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#159a59}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{display:inline-block;padding:6px 10px;border-radius:99px;background:#eaf8ef;color:#17683a;font-size:11px;font-weight:900}.warn{background:#fff1cc;color:#805b00}
.modal{position:fixed;inset:0;background:#04182cdd;display:grid;place-items:center;padding:15px;z-index:20}.dialog{background:#fff;border-radius:16px;padding:22px;width:min(520px,96vw)}#reader{width:100%}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf1f5}
@media(max-width:650px){.grid{grid-template-columns:1fr}.actions button{flex:1}header{font-size:12px}.row{grid-template-columns:1fr 60px}}
</style></head><body><div id="app"></div>
<script>
const SB=supabase.createClient('https://uehuvtnrsktskfmmbnul.supabase.co','sb_publishable_e-D582vTrmEAqG7X18sSlg_51trSTZG');
const DEMO={batch:'WV260930-04',product:'Whey Vanilla',spec:'WV-V3',pallet:'1/2',
items:[{name:'Maltodextrin',kg:25,qty:40},{name:'Skimmed Milk Powder',kg:25,qty:30},{name:'Whey Protein Concentrate',kg:20,qty:15},{name:'Vanilla Flavour',kg:5,qty:4}]};
let me=null,adminPin='',view='login',stage=null,checkNo=1,qr=null,selected=null;
let state=JSON.parse(localStorage.getItem('bc_runtime')||'null')||{scans:{build:{1:{},2:{}},filling:{1:{},2:{}}},ops:{build:{},filling:{}},holds:[],audit:[],quality:{status:'waiting',by:null,id:null,time:null,reason:null}};
const A=document.getElementById('app');
function save(){localStorage.setItem('bc_runtime',JSON.stringify(state))}
function log(x){state.audit.unshift(new Date().toLocaleString()+' — '+x);save()}
function H(){return `<header><b>APPLIED NUTRITION</b><span>Blender Control</span><span class="grow"></span><span>${me?.name||''}</span><button class="secondary" onclick="home()">Home</button><button class="secondary" onclick="logout()">Logout</button></header>`}
function R(){
 if(view==='login'){A.innerHTML=`<main class="login"><div class="card"><span class="ey">BLENDER CONTROL</span><h1>Sign in</h1><p class="muted">Enter your 6-digit PIN</p><input id="pin" class="pin" inputmode="numeric" maxlength="6" type="password"><button class="primary" style="width:100%" onclick="login()">Login</button><p id="err" class="muted"></p></div></main>`;return}
 if(view==='home'){A.innerHTML=H()+`<main class="wrap"><span class="ey">${me.role.toUpperCase()}</span><h1>Select operation</h1><p class="muted">${DEMO.product} · ${DEMO.batch} · ${DEMO.spec} · Pallet ${DEMO.pallet}</p><div class="grid"><button class="tile" onclick="openStage('build')"><b>Build Pallet</b>Prepare, label and independently verify ingredients</button><button class="tile green" onclick="startMaster()"><b>Filling Check</b>Scan Master Pallet QR before verification</button>${me.role==='quality'||me.role==='admin'?`<button class="tile" style="background:#7656a8" onclick="qualityStart()"><b>Quality Release</b>Release or hold after Filling verification</button>`:''}</div><div class="card"><h2>Filling / Quality status</h2><div id="qualityHome"></div></div>${me.role==='admin'?`<div class="card"><h2>Administration</h2><div class="actions"><button class="primary" onclick="view='users';R()">Users</button><button class="secondary" onclick="showAudit()">Audit trail</button><button class="danger" onclick="resetDemo()">Reset demo batch</button></div></div>`:''}</main>`;setTimeout(()=>{let e=document.getElementById('qualityHome');if(e)e.innerHTML=qualityBanner()},0);return}
 if(view==='users'){A.innerHTML=H()+`<main class="wrap"><span class="ey">ADMINISTRATION</span><h1>Users</h1><div class="card"><h2>Registered users</h2><div id="userlist"><p class="muted">Loading users...</p></div></div><div class="card"><h2>Add employee</h2><p class="muted">User ID is generated automatically (AN0001, AN0002...)</p><input id="nm" placeholder="Full name"><input id="np" maxlength="6" inputmode="numeric" type="password" placeholder="6-digit PIN"><select id="role"><option value="operator">Operator</option><option value="supervisor">Supervisor</option><option value="quality">Quality</option><option value="admin">Admin</option></select><button class="primary" onclick="addUser()">Create user</button><p id="msg" class="muted"></p></div></main>`;loadUsers();return}
 if(view==='work'){
   const d=state.scans[stage][checkNo];
   A.innerHTML=H()+`<main class="wrap"><span class="ey">${stage.toUpperCase()} · CHECK ${checkNo}</span><h1>${DEMO.product}</h1><p class="muted">Batch ${DEMO.batch} · ${DEMO.spec} · Pallet ${DEMO.pallet}</p><span class="status">INDEPENDENT CHECK</span>
   <div class="card">${DEMO.items.map((x,i)=>{let n=(d[i]||[]).length,p=Math.min(100,100*n/x.qty);return `<div class="row"><div><b>${x.name}</b><div class="muted">${x.kg} kg · ${x.qty} required</div><div class="bar"><i style="width:${p}%"></i></div><div class="actions"><button class="primary" onclick="scanBag(${i})">Scan QR</button>${stage==='build'?`<button class="secondary" onclick="previewLabels(${i})">Generate ${x.qty} QR Codes</button><button class="secondary" onclick="showTestQR(${i})">Test QR</button><button class="secondary" onclick="labels(${i})">Print labels</button>`:''}</div></div><b>${n}/${x.qty}</b></div>`}).join('')}</div>
   <div class="actions"><button class="primary" onclick="completeCheck()">Complete Check ${checkNo}</button><button class="danger" onclick="reportHold()">Report discrepancy</button><button class="secondary" onclick="showAudit()">Audit</button></div></main>`;return}
}
async function login(){
 const p=document.getElementById('pin').value.replace(/\D/g,''); if(p.length!==6)return err('Enter 6 digits.');
 const {data,error}=await SB.rpc('login_pin',{p_pin:p});
 if(error||!data?.length)return err('Invalid or inactive PIN.');
 me=data[0]; if(me.role==='admin')adminPin=p; log(me.name+' signed in'); view='home';R()
}
function err(x){document.getElementById('err').textContent=x}
function logout(){if(me)log(me.name+' signed out');me=null;adminPin='';view='login';R()}
function home(){view='home';stage=null;selected=null;R()}
function openStage(x){stage=x;checkNo=state.ops[x][1]?2:1;if(checkNo===2&&state.ops[x][1]===me.id){alert('Check 2 must be completed by a different operator.');return}view='work';log(me.name+' opened '+x+' Check '+checkNo);R()}
async function loadUsers(){
 const box=document.getElementById('userlist');if(!box)return;
 const {data,error}=await SB.rpc('admin_list_users',{p_admin:me.id,p_pin:adminPin});
 if(error){box.innerHTML='<p class="muted">User directory needs the final database update before it can be displayed.</p>';return}
 box.innerHTML=`<table><thead><tr><th>User ID</th><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody>${data.map(u=>`<tr><td><b>${u.employee_id}</b></td><td>${u.name}</td><td>${u.role}</td><td>${u.active?'Active':'Inactive'}</td></tr>`).join('')}</tbody></table>`;
}
async function addUser(){
 const nm=document.getElementById('nm').value.trim(),np=document.getElementById('np').value,role=document.getElementById('role').value,msg=document.getElementById('msg');
 if(!nm||!/^\d{6}$/.test(np)){msg.textContent='Enter the employee name and a 6-digit PIN.';return}
 const {data,error}=await SB.rpc('admin_create_user',{p_admin:me.id,p_pin:adminPin,p_name:nm,p_new_pin:np,p_role:role});
 if(error){msg.textContent='Database update required before automatic IDs can be used.';return}
 msg.textContent='User '+data+' created successfully.';document.getElementById('nm').value='';document.getElementById('np').value='';loadUsers()
}
function startMaster(){stage='filling';camera('master',null)}
function scanBag(i){selected=i;camera('bag',i)}
function camera(kind,i){
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="cam"><div class="dialog"><span class="ey">QR SCANNER</span><h2>${kind==='master'?'Scan Pallet Master QR':'Scan Bag QR'}</h2><p class="muted">Point the rear camera at the label.</p><div id="reader"></div><div class="actions"><button class="secondary" onclick="stopCam()">Cancel</button></div></div></div>`);
 qr=new Html5Qrcode('reader');qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},t=>gotQR(kind,i,t),()=>{}).catch(()=>{alert('Camera could not start. Allow camera access for this website in Safari/browser settings.');stopCam()})
}
function stopCam(){const done=()=>document.getElementById('cam')?.remove();if(qr){try{qr.stop().then(done).catch(done)}catch(e){done()}}else done();qr=null}
function norm(x){return String(x).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function gotQR(kind,i,t){
 if(kind==='master'){if(t!==`AN|MASTER|${DEMO.batch}`)return;stopCam();openStage('filling');return}
 const x=DEMO.items[i],a=t.trim().split('|');if(a.length<7||a[0]!=='AN'||a[1]!=='BAG'||a[2]!==DEMO.batch||norm(a[3])!==norm(x.name))return;
 const seq=+a[4],total=+a[5],kg=+a[6];if(total!==x.qty||kg!==x.kg||seq<1||seq>x.qty){stopCam();hold('QR/specification mismatch: '+x.name);return}
 const arr=state.scans[stage][checkNo][i]||[];if(arr.includes(seq)){stopCam();alert('This bag has already been scanned in this check.');return}
 stopCam();
 if(seq===1&&!confirm(`CONFIRM MATERIAL\n\n${x.name}\n${x.kg} kg\n\nDoes the physical product and bag weight match?`)){hold('Material/weight rejected: '+x.name);return}
 state.scans[stage][checkNo][i]=[...arr,seq];log(`${stage} Check ${checkNo}: ${x.name} ${seq}/${x.qty} scanned by ${me.name}`);R()
}
function completeCheck(){
 const d=state.scans[stage][checkNo],missing=DEMO.items.filter((x,i)=>(d[i]||[]).length!==x.qty);
 if(missing.length){hold('Incomplete scan: '+missing.map(x=>x.name).join(', '));return}
 if(checkNo===1){state.ops[stage][1]=me.id;log(`${stage} Check 1 completed by ${me.name}`);save();alert('Check 1 complete. Check 2 must be completed by a DIFFERENT operator.');logout();return}
 if(state.ops[stage][1]===me.id){alert('Check 2 must be completed by a different operator.');return}
 state.ops[stage][2]=me.id;log(`${stage} Check 2 completed by ${me.name}`);save();
 if(stage==='build'){alert('Build complete. Master Pallet label is ready to print.');printMaster()}else {state.quality={status:'waiting',by:null,id:null,time:null,reason:null};save();alert('Filling verification complete. WAITING FOR QUALITY RELEASE — DO NOT FILL BLENDER.');}
 view='home';R()
}
function hold(reason){state.holds.push({stage,checkNo,reason,user:me?.name,time:new Date().toISOString(),resolved:false});log('HOLDING: '+reason);alert('HOLDING — '+reason+'. Supervisor intervention required.')}
function reportHold(){const r=prompt('Describe the discrepancy');if(r)hold(r)}
function previewLabels(i){
 const x=DEMO.items[i];
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="qrprev"><div class="dialog" style="max-height:90vh;overflow:auto"><span class="ey">QR LABEL GENERATOR</span><h2>${x.name}</h2><p class="muted">${x.kg} kg · ${x.qty} unique bag labels · Batch ${DEMO.batch}</p><div id="qrgrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div><div class="actions"><button class="primary" onclick="labels(${i})">Print all ${x.qty}</button><button class="secondary" onclick="document.getElementById('qrprev').remove()">Close</button></div></div></div>`);
 const g=document.getElementById('qrgrid');
 for(let n=1;n<=x.qty;n++){
   const box=document.createElement('div');box.style='border:1px solid #dce5ee;border-radius:10px;padding:10px;text-align:center;background:white';
   box.innerHTML=`<div id="pv${i}_${n}" style="display:flex;justify-content:center"></div><b>${String(n).padStart(2,'0')}/${x.qty}</b><div class="small">${x.name} · ${x.kg} kg</div>`;
   g.appendChild(box);
   new QRCode(document.getElementById(`pv${i}_${n}`),{text:`AN|BAG|${DEMO.batch}|${x.name.toUpperCase()}|${n}|${x.qty}|${x.kg}`,width:112,height:112});
 }
 log(`${x.qty} QR codes previewed: ${x.name}`);
}
function showTestQR(i,n=1){
 const x=DEMO.items[i];document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="testqr"><div class="dialog" style="text-align:center"><span class="ey">TEST QR</span><h2>${x.name} ${String(n).padStart(2,'0')}/${x.qty}</h2><div id="testqrcode" style="display:flex;justify-content:center;margin:20px"></div><p class="muted">Open this QR on another screen and scan it with Blender Control.</p><button class="secondary" onclick="document.getElementById('testqr').remove()">Close</button></div></div>`);new QRCode(document.getElementById('testqrcode'),{text:`AN|BAG|${DEMO.batch}|${x.name.toUpperCase()}|${n}|${x.qty}|${x.kg}`,width:240,height:240})
}
function labels(i){
 const x=DEMO.items[i],w=window.open('','_blank');if(!w)return alert('Allow pop-ups for label printing.');
 let h=`<html><head><style>@page{size:70mm 50mm;margin:0}body{margin:0;font-family:Arial}.l{width:70mm;height:50mm;padding:4mm;page-break-after:always;display:flex;gap:3mm;align-items:center}.q{width:28mm}.t b{font-size:14pt;display:block}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script></head><body>`;
 for(let n=1;n<=x.qty;n++)h+=`<div class="l"><div class="q" id="q${n}"></div><div class="t"><b>${x.name}</b>${x.kg} kg<br>${String(n).padStart(2,'0')}/${x.qty}<br>${DEMO.batch}</div></div>`;
 h+=`<script>window.onload=()=>{${Array.from({length:x.qty},(_,j)=>`new QRCode(document.getElementById('q${j+1}'),{text:'AN|BAG|${DEMO.batch}|${x.name.toUpperCase()}|${j+1}|${x.qty}|${x.kg}',width:106,height:106});`).join('')}setTimeout(()=>window.print(),700)}<\/script></body></html>`;w.document.write(h);w.document.close();log(`${x.qty} labels generated: ${x.name}`)
}
function printMaster(){
 const w=window.open('','_blank');if(!w)return alert('Allow pop-ups for printing.');
 w.document.write(`<html><head><style>@page{size:70mm 50mm;margin:0}body{text-align:center;font-family:Arial;padding:4mm}#q{width:28mm;margin:auto}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script></head><body><h2>${DEMO.product}</h2><b>MASTER PALLET</b><div>${DEMO.batch}</div><div id="q"></div><script>new QRCode(document.getElementById('q'),{text:'AN|MASTER|${DEMO.batch}',width:106,height:106});setTimeout(()=>window.print(),600)<\/script></body></html>`);w.document.close()
}
function showAudit(){alert(state.audit.length?state.audit.join('\n'):'No audit events yet.')}
function qualityBanner(){
 const q=state.quality||{status:'waiting'};
 if(!state.ops.filling[1]||!state.ops.filling[2]) return '<span class="status warn">FILLING CHECKS NOT COMPLETE</span><p class="muted">Quality release will be available after both Filling checks.</p>';
 if(q.status==='released') return `<span class="status">QUALITY RELEASED ✓</span><h3>READY TO FILL</h3><p class="muted">Released by ${q.id||''} — ${q.by||''}<br>${q.time?new Date(q.time).toLocaleString():''}</p>`;
 if(q.status==='hold') return `<span class="status warn">QUALITY HOLD</span><h3>DO NOT FILL</h3><p>${q.reason||''}</p>`;
 return '<span class="status warn">WAITING FOR QUALITY RELEASE</span><h3>DO NOT FILL BLENDER</h3>';
}
function qualityStart(){
 if(!(me.role==='quality'||me.role==='admin')) return alert('Quality access required.');
 if(!state.ops.filling[1]||!state.ops.filling[2]) return alert('Filling Check 1 and Check 2 must be completed before Quality release.');
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="qrel"><div class="dialog"><span class="ey">QUALITY RELEASE</span><h2>${DEMO.product}</h2><p><b>Batch:</b> ${DEMO.batch}<br><b>Pallet:</b> ${DEMO.pallet}</p><span class="status">FILLING CHECKS COMPLETE</span><p class="muted">Confirm the Quality decision for this batch.</p><div class="actions"><button class="primary" onclick="qualityDecision('released')">Release for Filling</button><button class="danger" onclick="qualityDecision('hold')">Place on Hold</button><button class="secondary" onclick="document.getElementById('qrel').remove()">Cancel</button></div></div></div>`);
}
function qualityDecision(decision){
 let reason=null;
 if(decision==='hold'){reason=prompt('Reason for Quality Hold');if(!reason)return}
 state.quality={status:decision,by:me.name,id:me.employee_id,time:new Date().toISOString(),reason};
 save();log(`QUALITY ${decision.toUpperCase()} by ${me.name}${reason?' — '+reason:''}`);
 document.getElementById('qrel')?.remove();
 alert(decision==='released'?'QUALITY RELEASED — READY TO FILL':'QUALITY HOLD — DO NOT FILL');
 R();
}
function resetDemo(){if(!confirm('Reset all demo scans/checks on this device?'))return;localStorage.removeItem('bc_runtime');location.reload()}
R();
</script></body></html>
